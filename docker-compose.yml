# Tone at https://tone.vsl-base.com
# On the server from /srv/apps/tone after git pull:
#   docker compose --env-file .env.docker up --build -d
#
# Requires Traefik on external network flux-network (Flux platform).
# Never use .env.local in production. Next-only — no worker service.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Tone}
        NEXT_PUBLIC_APP_TAGLINE: ${NEXT_PUBLIC_APP_TAGLINE:-Open the site, play a string, tune the guitar.}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tone.vsl-base.com}
    image: tone:latest
    container_name: tone-web
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-https://tone.vsl-base.com}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://tone.vsl-base.com}
    networks:
      - flux-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: flux-network
      traefik.http.routers.tone-web.rule: Host(`tone.vsl-base.com`)
      traefik.http.routers.tone-web.entrypoints: websecure
      traefik.http.routers.tone-web.tls: "true"
      traefik.http.routers.tone-web.tls.certresolver: myresolver
      traefik.http.routers.tone-web.service: tone-web

      traefik.http.routers.tone-http.rule: Host(`tone.vsl-base.com`)
      traefik.http.routers.tone-http.entrypoints: web
      traefik.http.routers.tone-http.service: tone-web

      traefik.http.services.tone-web.loadbalancer.server.port: "3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  flux-network:
    external: true
